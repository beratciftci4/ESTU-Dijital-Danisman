  - Matematik mezunları her alanda yüksek lisans ve doktora programlarına başvurabilir.
matematik_program_bilgileri#bolum-Mezuniyet_Koşulları:
  - Matematik bölümünden mezun olmak için bütün derslerini geçmen, FF, DZ veya YZ notunun olmaması, en az 240 AKTS tamamlaman ve GNO'nun 4,00 üzerinden en az 2,00 olması gerekir.
matematik_program_bilgileri#bolum-İstihdam_Olanakları:
  - Pedagojik formasyonu olan matematik mezunları ortaöğretim kurumlarında matematik öğretmeni olabilir.
  - Matematik mezunları kamu ve özel kuruluşlarda ve bankalarda araştırmacı, planlamacı ya da bilgisayarcı olarak çalışabilir; başarılı mezunlar araştırma görevlisi olabilir.
matematik_program_bilgileri#bolum-Ölçme_ve_Değerlendirme:
  - Bologna sayfasına göre dönem içi değerlendirmelerin başarı notuna katkısı %30 ile %70 arasındadır; ancak güncel yönetmelikte üst sınır %60'tır.
  - Harf notun, dersi alan öğrencilerin genel başarısı da dikkate alınarak belirlenir; AA 4,0'dan FF 0,0'a kadar katsayılar kullanılır.
  - DZ devamsızlık notudur ve FF ya da YZ ile aynı sayılır; EK notu eksikler tamamlanmazsa FF veya YZ'ye dönüşür.

# ---------------- Mühendislik Fakültesi Staj Yönergesi ----------------
muh_staj#madde-1:
  - Bu yönerge Mühendislik Fakültesi öğrencilerinin yapmakla yükümlü olduğu stajların planlanma, uygulanma ve değerlendirilme kurallarını düzenler.
muh_staj#madde-2:
  - Yönerge, eğitim-öğretim yönetmeliğinin 8. maddesine ve Yükseköğretimde Uygulamalı Eğitimler Çerçeve Yönetmeliği'ne dayanır.
muh_staj#madde-3:
  - Bu madde yönergede geçen kavramları tanımlar.
  - Yönergedeki bölümler Bilgisayar, Çevre, Elektrik-Elektronik, Endüstri, İnşaat, Kimya, Malzeme Bilimi ve Makine Mühendisliği bölümleridir.
  - Yaz dönemi, bahar finallerinin bittiği tarihten güz derslerinin başladığı tarihe kadar olan dönemdir.
muh_staj#madde-4:
  - Mühendislik stajının amacı, bölümünle ilgili iş alanlarını tanıman ve okulda öğrendiklerini uygulayarak mesleki deneyim kazanmandır.
muh_staj#madde-5:
  - Mühendislik Fakültesi Staj Komisyonu, dekan yardımcısı başkanlığında bölüm staj komisyonu başkanlarından oluşur.
  - Fakülte Staj Komisyonu staj esaslarını belirler, SGK bildirgelerinin izlenmesini sağlar ve staj itirazları ile muafiyet taleplerini yönetim kuruluna sunar.
muh_staj#madde-6:
  - Bölüm Staj Komisyonu, bölüm başkanının oluşturduğu en az üç öğretim elemanından oluşur.
  - Bölüm Staj Komisyonu bölüm staj kılavuzunu hazırlar, staj yeri bulmana yardımcı olur, belgeleri inceler ve stajını başarılı ya da başarısız olarak değerlendirir.
muh_staj#madde-7:
  - Staj yapan her grup için bir sorumlu öğretim elemanı görevlendirilir; staj raporunu değerlendirir ve notunu sisteme girer.
muh_staj#madde-8:
  - Mühendislik Fakültesi'nde toplam staj süresi 40 günden az olamaz.
  - Staja devam zorunludur; geçerli mazeretle gidemediğin günleri telafi etmen gerekir ve bu günler toplam zorunlu staj süresinin %10'unu geçemez.
  - Kurallara uymadığın için kurum stajını sonlandırırsa o stajı yenilemen gerekir.
  - Ön lisans diploması almak istersen, bölümün lisans için belirlediği zorunlu staj süresinin yarısı kadar staj yapman gerekir.
  - İsteğe bağlı proje temelli staj 45 ile 90 gün arasındadır ve bölüm staj komisyonu uygun görürse zorunlu stajlardan birinin yerine sayılabilir.
  - Derssiz günlerinde isteğe bağlı staj da yapabilirsin, ama zorunlu stajla isteğe bağlı staja aynı anda devam edemezsin.
  - Zorunlu stajlarda sigortan fakülte tarafından yapılır.
muh_staj#madde-9:
  - Staj için hazırlaman gereken belgeler staj başvuru ve kabul formu (3 nüsha), SGK işe giriş bildirgesi, devam çizelgesi, kurum değerlendirme formu ve staj raporudur.
  - Stajı yarıda bırakırsan kurum, staj ayrılış formunu doldurup dekanlığa gönderir.
muh_staj#madde-10:
  - Mühendislik stajı esas olarak yaz döneminde ya da güz ile bahar arasındaki tatilde yapılır; ders dönemi boyunca, ekle-sil haftası ve sınav günleri dahil staj yapamazsın.
  - Hafta içi en az 3 tam gün dersin yoksa, ders ve sınavının olmadığı günlerde dönem içinde staj yapabilirsin.
  - Staja 4. yarıyılın sonundan itibaren başvurabilirsin.
  - Staj başlangıcından en az 15 gün önce staj başvuru ve kabul formunu doldurup Bölüm Staj Komisyonu'na teslim etmelisin.
  - Normalde bir hafta 5 iş günü sayılır; hafta sonu da çalışan işyerlerinde, belgelersen oranın haftalık iş günü esas alınır.
  - Staj işlemlerini kendin yapamıyorsan yazılı dilekçeyle vekalet verebilirsin.
muh_staj#madde-11:
  - Bölüm staj kılavuzuna uygun staj yeri bulmak senin sorumluluğundadır; bulduğun yerin uygunluğuna Bölüm Staj Komisyonu karar verir.
  - Yurt dışında da, değişim programıyla ya da kendi bulduğun bir kurumda komisyon önerisi ve yönetim kurulu kararıyla staj yapabilirsin; yurt dışı stajda sigorta primi ödenmez.
muh_staj#madde-12:
  - Staja başladıktan sonra Bölüm Staj Komisyonu'nun onayı olmadan staj yerini değiştiremezsin; onaylanan değişiklik en geç 3 gün içinde dekanlığa bildirilir.
  - Kurumda grev, yangın, iflas, iş kazası ya da doğal afet olursa veya staj amacı dışında çalıştırılırsan, komisyon onayıyla stajını başka bir yerde tamamlayabilirsin.
muh_staj#madde-13:
  - Staja giderken SGK işe giriş bildirgesini, devam çizelgesini ve kurum değerlendirme formunu kurumdaki staj yetkilisine teslim edersin; formlar staj bitince kaşeli ve kapalı zarfta geri gelir.
  - Kurumun gizli bilgilerini paylaşamazsın ve kurumun çalışma, disiplin ve iş güvenliği kurallarına uymak zorundasın; kurallara uymazsan stajı tekrarlarsın.
  - Stajının değerlendirilmesini istediğin yarıyılda staj gruplarından birine kaydolup staj raporunu belirlenen tarihe kadar sorumlu öğretim elemanına teslim etmelisin.
  - Bir dönemde birden fazla staj dersine kayıt olabilirsin.
  - Mezuniyete sadece stajı kalan öğrenci, staj değerlendirmesi bitince dilekçe verirse dönem sonunu beklemeden mezun olabilir.
muh_staj#madde-14:
  - Stajın başarılı sayılması için kurumun doldurduğu değerlendirme formundaki notun 5 üzerinden en az 3 olması ön koşuldur.
  - Bölüm Staj Komisyonu stajını başarılı ya da başarısız olarak değerlendirir; gerekirse sözlü sunum isteyebilir.
  - Staj değerlendirmesine, kararın ilanından sonraki 5 iş günü içinde dekanlığa yazılı olarak itiraz edebilirsin.
  - Staj notu sisteme başarılıysa YT, başarısızsa YZ olarak işlenir.
  - Derslerini bitirip stajını yapmayan ya da stajdan kalan öğrenciye mezuniyet belgeleri verilmez; kaydını yenileyip staj dersine kaydolarak stajı tekrarlaman gerekir.
muh_staj#madde-15:
  - Yatay ya da dikey geçişle geldiysen önceki okulunda yaptığın stajın kısmen ya da tamamen kabulüne, bölüm staj komisyonunun önerisiyle yönetim kurulu karar verir.
  - İlgili sektörde SGK'lı olarak zorunlu staj süresi kadar çalıştığını belgeler ve staj raporunu teslim edersen stajdan muaf tutulabilirsin; aynı işyeri için birden fazla stajdan muaf olamazsın.
  - Staj muafiyeti için kayıt yenileme haftasında Bölüm Staj Komisyonu'na başvurmalısın; muafiyet uygun görülürse staj dersi YT notuyla geçilmiş sayılır.
  - Yandal öğrencilerinin yandal için zorunlu stajı yoktur.
  - Muafiyet ve staj kararlarına, ilandan sonraki 5 iş günü içinde dekanlığa yazılı itiraz edebilirsin.
muh_staj#madde-16:
  - Yönergede hüküm olmayan durumlarda eğitim-öğretim yönetmeliği, Uygulamalı Eğitimler Çerçeve Yönetmeliği ve 2547 sayılı Kanun uygulanır.
muh_staj#madde-17:
  - Yönerge, Senato'nun kabul ettiği tarihte yürürlüğe girmiştir.
muh_staj#madde-18:
  - Yönergeyi ESTÜ Rektörü yürütür.
muh_staj#ek-2:
  - Mühendislik staj akış şemasına göre staj yeri bulur, başvuru formunu 3 nüsha doldurup kuruma onaylatır ve staj başlangıcından en az 15 gün önce Bölüm Staj Komisyonu'na başvurursun.
  - Onaylı formun bir kopyasını staj başlangıcından en fazla 7 gün önce Öğrenci İşleri'ne iletip SGK girişini yaptırırsın; staj bitince raporu ve formları komisyona teslim edersin.
muh_staj#ek-3:
  - Bu, Mühendislik Fakültesi staj başvuru ve kabul formunun örneğidir; öğrenci, staj yeri ve onay bilgileri bu forma yazılır.
muh_staj#ek-4:
  - Bu, stajda her gün imzaladığın devam çizelgesinin örneğidir; kaç iş günü staj yapacağın bölümünün staj kılavuzuna göre belirlenir.
  - Raporlu olduğun staj günlerini telafi etmen ve raporunu Bölüm Staj Komisyonu'na bildirmen gerekir.
muh_staj#ek-5:
  - Bu, kurumun seni ölçütlere göre 1-5 arasında puanladığı staj değerlendirme formudur; ortalama en az 3 olmalıdır.
muh_staj#ek-6:
  - Bu, staj raporu sayfasının örneğidir; her sayfaya çalıştığın bölüm ve tarih yazılır ve birim sorumlusuna imzalatılır.
muh_staj#ek-7:
  - Bu, Mühendislik staj raporunun kapak sayfası örneğidir.
muh_staj#ek-8:
  - Bu, staj raporunun iç kapak sayfası örneğidir; öğrenci ve kurum bilgileri ile kurum yetkilisinin imzası yer alır.
muh_staj#ek-9:
  - Bu, stajı yarıda bırakan öğrenci için kurumun dekanlığa gönderdiği staj ayrılış formudur.
muh_staj#ek-10:
  - Bu, Bölüm Staj Komisyonu'nun seni değerlendirdiği formdur; stajın başarılı sayılması için kurumun puanının ve komisyonun rapor puanının her birinin 5 üzerinden en az 3 olması gerekir.

