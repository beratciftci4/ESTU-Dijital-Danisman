# Uygulamada seçilebilen lisans programları.
#   fakulte   : fakulteler altındaki anahtar (staj yönergesi buradan bulunuyor)
#   bologna   : akts.eskisehir.edu.tr'deki program numarası
#   staj_gunu : zorunlu staj süresi, zorunlu staj yoksa null
#   staj_birimi: yönergedeki birim ("iş günü" ya da "gün"), yönerge nasıl yazıyorsa
#   staj_notu : staj süresinin nereden geldiği
#   staj_ek   : kısa cevaba eklenecek not (isteğe bağlı)

fakulteler:
  fen:
    ad: Fen Fakültesi
    staj_belgesi: fen_staj
    staj_maddesi: fen_staj#madde-7      # staj süresinin yazdığı madde
    staj_listesi: fen_staj#ek-4         # hangi bölümde zorunlu, hangisinde isteğe bağlı (EK-3 notu)
    staj_birimi: iş günü
  bbbf:
    ad: Bilgisayar ve Bilişim Bilimleri Fakültesi
    staj_belgesi: bbbf_staj
    staj_maddesi: bbbf_staj#madde-8     # ders planındaki her staj en az 20 iş günü
    staj_listesi: bbbf_staj#madde-8
    staj_birimi: iş günü
  muhendislik:
    ad: Mühendislik Fakültesi
    staj_belgesi: muh_staj
    staj_maddesi: muh_staj#madde-8      # toplam staj en az 40 gün, bütün bölümler
    staj_listesi: muh_staj#madde-8
    staj_birimi: gün

programlar:
  - id: biyoloji
    ad: Biyoloji
    fakulte: fen
    bologna: 188
    staj_gunu: 20
    staj_notu: Fen Fakültesi Staj Yönergesi EK-3 (Fizik, İstatistik ve Biyoloji 20 iş günü zorunlu)
  - id: fizik
    ad: Fizik
    fakulte: fen
    bologna: 186
    staj_gunu: 20
    staj_notu: Fen Fakültesi Staj Yönergesi EK-3 (Fizik, İstatistik ve Biyoloji 20 iş günü zorunlu)
  - id: istatistik
    ad: İstatistik
    fakulte: fen
    bologna: 189
    staj_gunu: 20
    staj_notu: Fen Fakültesi Staj Yönergesi EK-3 (Fizik, İstatistik ve Biyoloji 20 iş günü zorunlu)
  - id: kimya
    ad: Kimya
    fakulte: fen
    bologna: 187
    staj_gunu: null
    staj_notu: Fen Fakültesi Staj Yönergesi EK-3 (Kimya ve Matematik için staj isteğe bağlı)
  - id: matematik
    ad: Matematik
    fakulte: fen
    bologna: 185
    staj_gunu: null
    staj_notu: Fen Fakültesi Staj Yönergesi EK-3 (Kimya ve Matematik için staj isteğe bağlı)
