# ---------------- Bilgisayar ve Bilişim Bilimleri Fakültesi Staj Yönergesi ----------------
bbbf_staj#madde-1:
  - Bu yönerge Bilgisayar ve Bilişim Bilimleri Fakültesi öğrencilerinin yapmakla yükümlü olduğu stajların planlanma, uygulanma ve değerlendirilme kurallarını düzenler.
bbbf_staj#madde-2:
  - Yönerge, 2547 sayılı Kanun'a, 2025 tarihli eğitim-öğretim yönetmeliğine ve Uygulamalı Eğitimler Çerçeve Yönetmeliği'ne dayanır.
bbbf_staj#madde-3:
  - Bu madde yönergede geçen kavramları (bölüm staj komisyonu, fakülte staj komisyonu, proje temelli staj gibi) tanımlar.
bbbf_staj#madde-4:
  - Stajın amacı, okuduğun programla ilgili iş alanlarını tanıman ve okulda öğrendiklerini uygulayarak mesleki deneyim kazanmandır.
bbbf_staj#madde-5:
  - Fakülte Staj Komisyonu, dekan yardımcısı başkanlığında bölüm staj komisyonu başkanlarından oluşur; staj esaslarını ve başlama dönemlerini belirler, itiraz ve muafiyet taleplerini yönetim kuruluna sunar.
bbbf_staj#madde-6:
  - Bölüm Staj Komisyonu en az üç öğretim elemanından oluşur; bölüm staj kılavuzunu hazırlar, staj yeri bulmana yardımcı olur ve stajını başarılı ya da başarısız olarak değerlendirir.
bbbf_staj#madde-7:
  - Staj yapan her grup için bir sorumlu öğretim elemanı görevlendirilir; staj raporunu değerlendirir ve notunu sisteme girer.
bbbf_staj#madde-8:
  - Bilgisayar ve Bilişim Bilimleri Fakültesi'nde ders planında kaç staj varsa o kadar staj yapman gerekir ve her biri en az 20 iş günü olmalıdır.
  - Staja dördüncü yarıyılın sonundan itibaren başlayabilirsin; staj esas olarak yaz döneminde ya da güz ile bahar arasında yapılır.
  - Yaz okulunda ya da dönem içinde haftada en az 3 tam iş günü dersin yoksa, derssiz günlerinde komisyon kararıyla staj yapabilirsin.
  - Normalde bir hafta 5 iş günü sayılır; hafta sonu da çalışan işyerlerinde, belgelersen oranın haftalık iş günü esas alınır.
  - İsteğe bağlı proje temelli staj 45 ile 90 gün arasındadır ve komisyon uygun görürse zorunlu stajlardan birinin yerine sayılabilir.
  - Zorunlu stajla isteğe bağlı staja aynı anda devam edemezsin; zorunlu stajlarda sigortan fakülte tarafından yapılır.
bbbf_staj#madde-9:
  - Staja devam zorunludur; belgeli mazeretle gidemediğin günleri stajın sonuna ekleyerek telafi edersin ve bu süre toplam zorunlu staj süresinin %10'unu geçemez.
  - Mazeretsiz devamsızlık yaparsan ya da kurum kurallarını ihlal edersen stajın başarısız sayılır.
bbbf_staj#madde-10:
  - Staj için hazırlaman gereken belgeler staj başvuru ve kabul formu (2 nüsha), genel sağlık sigortası belgesi, SGK işe giriş bildirgesi, devam çizelgesi, kurum değerlendirme formu ve staj raporu dosyasıdır.
bbbf_staj#madde-11:
  - Staja başlamadan en az 15 gün önce staj başvuru ve kabul formunu doldurup Bölüm Staj Komisyonu'na teslim etmelisin; form en az 7 gün önce dekanlığa iletilir.
  - SGK girişin yapılmadan staja başlayamazsın; başvuru takvimine uymayan başvurular işleme alınmaz.
  - Staj işlemlerini kendin yapamıyorsan noter onaylı vekaletnameyle yaptırabilirsin.
bbbf_staj#madde-12:
  - Staj yeri bulmak senin sorumluluğundadır; staj yerinde seni takip edecek kişinin bilişim alanında mesleki yetkinliği olmalıdır.
  - Kendi bulduğun yerde staja başlamadan önce Bölüm Staj Komisyonu'nun onayını alman zorunludur; yurt dışında da yönetim kurulu kararıyla staj yapabilirsin, ama yurt dışı stajda sigorta primi ödenmez.
bbbf_staj#madde-13:
  - Staja başladıktan sonra Bölüm Staj Komisyonu'nun onayı olmadan staj yerini değiştiremezsin; grev, iflas, afet ya da amaç dışı çalıştırılma gibi durumlarda komisyon onayıyla başka yerde tamamlayabilirsin.
bbbf_staj#madde-14:
  - Staj belgelerini kurumdaki staj yetkilisine teslim edersin; formlar staj bitince kaşeli ve kapalı zarfta geri gelir, kaşesiz formlar geçersizdir.
  - Stajını yapmak istediğin yarıyılda staj ders gruplarından birine kaydolup staj raporunu belirlenen tarihe kadar sorumlu öğretim elemanına teslim etmelisin; bir dönemde birden fazla staj dersine kayıt olabilirsin.
  - Mezuniyete sadece stajı kalan öğrenci, staj değerlendirmesi bitince dilekçe verirse dönem sonunu beklemeden mezun olabilir.
bbbf_staj#madde-15:
  - Stajın başarılı sayılması için kurumun değerlendirme puanının ve komisyonun rapor puanının her birinin 5 üzerinden en az 3 olması gerekir.
  - Staj değerlendirmesine, kararın ilanından sonraki 5 iş günü içinde dekanlığa yazılı olarak itiraz edebilirsin.
  - Staj notu sisteme başarılıysa YT, başarısızsa YZ olarak işlenir; stajını yapmayan ya da stajdan kalan öğrenciye mezuniyet belgeleri verilmez.
bbbf_staj#madde-16:
  - Geçişle geldiysen önceki okulundaki stajının kabulü için ilk dönemde derslerin başlamasından itibaren üç hafta içinde bölüm başkanlığına başvurmalısın.
  - İlgili sektörde SGK'lı olarak zorunlu staj süresi kadar çalıştığını belgeler ve staj raporunu teslim edersen stajdan muaf tutulabilirsin; aynı işyeri için birden fazla stajdan muaf olamazsın.
  - Yandal öğrencilerinin yandal için zorunlu stajı yoktur.
bbbf_staj#madde-17:
  - Yönergede hüküm olmayan durumlarda eğitim-öğretim yönetmeliği ve Uygulamalı Eğitimler Çerçeve Yönetmeliği uygulanır.
bbbf_staj#madde-18:
  - Yönerge, Senato'nun kabul ettiği tarihte (22.09.2026) yürürlüğe girmiştir.
bbbf_staj#madde-19:
  - Yönergeyi ESTÜ Rektörü yürütür.
bbbf_staj#ek-2:
  - Bu, Bilgisayar ve Bilişim Bilimleri Fakültesi staj süreci akış şemasıdır; başvuru, onay, SGK girişi, staj ve rapor teslimi adımlarını gösterir.
bbbf_staj#ek-3:
  - Bu, staj başvuru ve kabul formunun örneğidir; öğrenci, staj yeri ve onay bilgileri bu forma yazılır.
bbbf_staj#ek-4:
  - Bu, staj başvuru ve kabul formunun İngilizce örneğidir.
bbbf_staj#ek-5:
  - Bu, stajda her gün imzaladığın devam çizelgesinin örneğidir; raporlu olduğun günleri telafi etmen gerekir.
bbbf_staj#ek-6:
  - Bu, kurumun seni puanladığı staj değerlendirme formudur.
bbbf_staj#ek-7:
  - Bu, kurum staj değerlendirme formunun İngilizce örneğidir.
bbbf_staj#ek-8:
  - Bu, staj raporu sayfasının örneğidir; her sayfaya çalıştığın bölüm ve tarih yazılır.
bbbf_staj#ek-9:
  - Bu, staj raporunun kapak sayfası örneğidir.
bbbf_staj#ek-10:
  - Bu, staj raporunun iç kapak sayfası örneğidir.
bbbf_staj#ek-11:
  - Bu, stajı yarıda bırakan öğrenci için kurumun dekanlığa gönderdiği staj ayrılış formudur.
bbbf_staj#ek-12:
  - Bu, Bölüm Staj Komisyonu'nun seni değerlendirdiği formdur.
bbbf_staj#tablo_gorsel-8:
  - Bu sayfadaki staj akış şeması belgede görüntü olarak yer aldığı için okunamıyor; belgenin 8. sayfasına bakmalısın.

