# ---------------- Akademik Danışmanlık Yönergesi ----------------
danismanlik#madde-1:
  - Bu yönerge ESTÜ öğrencilerine verilen akademik danışmanlık hizmetinin kurallarını düzenler.
danismanlik#madde-2:
  - Yönerge 2547 sayılı Kanun ile ESTÜ'nün eğitim-öğretim yönetmeliklerine dayanır.
danismanlik#madde-3:
  - Bu madde yönergedeki kavramları tanımlar; örneğin ders seçim onayı, danışmanın ders seçimini uygun bulduğunu gösteren onaydır.
danismanlik#madde-4:
  - Akademik danışmanlığın amacı seni üniversite yaşamı, mesleki gelişim ve kariyer konusunda yönlendirmek, ders seçiminde bilgilendirmek ve derslerini onaylamaktır.
danismanlik#madde-5:
  - Akademik danışman öncelikle öğretim üyeleri arasından, bölüm başkanlığının önerisi ve yönetim kurulu kararıyla atanır.
  - Danışmanın ilke olarak mezun olana kadar aynı kalır; gerekçeli bir durumda aynı usulle danışman değişikliği yapılabilir.
  - Danışman değişikliği sana öğrenci bilgi sistemi üzerinden duyurulur.
  - Çift anadal veya yandal yapıyorsan her program için ayrı danışman atanır.
danismanlik#madde-6:
  - Danışman kaydını onaylar, mezuniyet için alman gereken dersler konusunda öneride bulunur ve ders seçiminde sana yardım eder.
  - Tekrar alman gereken derslerde önce FF, YZ ve DZ notlu derslere kaydolmanı, çakışma varsa en alt yarıyıldaki dersi almanı sağlar.
  - Ekle/sil sonrası üç hafta içinde tek bir dersten çekilme talebini danışman onaylar.
  - Danışman dönemin ilk haftasında haftalık görüşme saatlerini ilan eder.
  - Danışman gerektiğinde seni psikolojik danışmanlık birimlerine yönlendirir; değişim programları, yatay ve dikey geçiş ve kariyer konusunda bilgilendirir.
  - Dönem sonunda mezuniyet koşullarını sağlayıp sağlamadığını kontrol eder ve mezun onayını verir.
  - Ek sınav veya tek ders sınavı dilekçeni de danışman kontrol edip onaylar.
danismanlik#madde-7:
  - Ders seçimi, ekle/sil, dersten çekilme ve mezuniyet kurallarını bilmek senin sorumluluğundadır.
  - Kayıt yenileme ve ders seçimini akademik takvimdeki tarihlerde obs.eskisehir.edu.tr üzerinden yapar, sonra danışmanınla iletişime geçip onay alırsın.
  - Danışman seçimini uygun bulmayıp onayı kaldırırsa ders seçimini güncellemen gerekir.
  - İletişim bilgilerin değişirse 15 gün içinde Öğrenci İşleri'ne yazılı bildirmelisin.
danismanlik#madde-8:
  - Bölüm başkanları danışmanlık sistemindeki sorunları çözmek için çalışır; dekanlıklar da öğrenci ve danışman taleplerine göre önlem alır.
danismanlik#madde-9:
  - Kayıt yenileme ve ders seçimi akademik takvimdeki kayıt yenileme haftasında öğrenci bilgi sistemi üzerinden yapılır.
  - Lisans öğrencileri için ders seçim günleri 7. yarıyıl ve üstü Pazartesi-Salı, 5. yarıyıl ve üstü Çarşamba, 3. yarıyıl ve üstü Perşembe, 1. yarıyıl ve üstü Cuma'dır.
danismanlik#madde-10:
  - Ders seçimini yapmazsan danışmanın senin yerine ders seçemez ve onay veremez.
  - Ders seçimini bitirince danışmanından onay alman zorunludur; onaylanmayan dersler ekle/sil sonrası üzerinden silinir.
  - Seçmeli kredini tamamladıysan yeni seçmeli ders ancak "yerine" işlemiyle alınabilir.
  - Mezun olabilmek için lisansta en az 240 AKTS'yi tamamlayacak şekilde ders alman gerekir.
  - Kısmen yabancı dille eğitim yapan programlarda mezuniyete kadar kredilerinin en az %30'unu yabancı dilde verilen derslerden alman gerekir.
  - Zorunlu derslerden FF, YZ veya DZ aldıysan bunları çakışma durumunda en alt yarıyıldan başlayarak tekrar almak zorundasın.
  - Seçmeli bir dersten kalırsan dersi tekrarlayabilir ya da danışman onayıyla yerine başka bir seçmeli alabilirsin.
  - GNO'n 2,00'nin altına düşerse akademik yetersizlik uyarısı alırsın; sonraki dönemde de yükseltemezsen CC altındaki derslerini de tekrar etmen gerekir.
  - Güz ve bahar dönemlerinde en çok 45 AKTS'lik derse kayıt olabilirsin; çift anadalda bu sınır 60 AKTS'dir.
  - Ekle/sil sonrası üç hafta içinde danışman onayıyla bir dersten çekilebilirsin; bir dönemde en fazla bir, lisans boyunca en fazla sekiz dersten çekilebilirsin.
  - Tekrar ettiğin bir dersten çekilemezsin.
  - GNO'nu yükseltmek için daha önce aldığın dersleri tekrar alabilirsin; ortalamaya en son aldığın not katılır.
  - Ders planında olmayan başka bir programın dersini yönetim kurulu kararıyla seçmeli olarak alabilirsin.
danismanlik#madde-11:
  - Normal süreyi aştıysan katkı payını öğrenci bilgi sistemi üzerinden ilgili bankaya yatırdıktan sonra kayıt yenileyebilirsin.
  - Katkı payını yatırmayan öğrenci kayıt yenileme sistemine giriş yapamaz; ücret yükümlülüğü olmayan öğrenci doğrudan kayıt yeniler.
  - Ders seçiminden önce birimin duyurularını ve transkriptindeki durum bilgisini incelemelisin.
  - Seçmeli bir dersin yerine farklı kodlu ders aldığında "yerine" işlemi yapman zorunludur; zorunlu ders için bu işlem dilekçeyle yapılır.
  - Ders seçimini tamamladıktan sonra ekle/sil tarihlerinde danışmanından onayı kaldırmasını isteyerek düzeltme yapabilirsin.
  - Çift anadal veya yandal yapıyorsan her program için ders seçimini ve danışman onayını ayrı ayrı alırsın.
danismanlik#madde-12:
  - Yönergede hüküm olmayan durumlarda ilgili mevzuat uygulanır.
danismanlik#madde-13:
  - Bu yönergeyle 2019 tarihli eski akademik danışmanlık yönergesi yürürlükten kaldırılmıştır.
danismanlik#madde-14:
  - Yönerge Senato'nun kabul ettiği tarihte yürürlüğe girmiştir.
danismanlik#madde-15:
  - Yönergeyi ESTÜ Rektörü yürütür.

# ---------------- Haklı ve Geçerli Nedenler ----------------
hakli_nedenler#giris-0:
  - Bu belge, yönetmeliklerde geçen haklı ve geçerli mazeret nedenlerini ve bunlarla ilgili kuralları açıklar.
hakli_nedenler#bent-1:
  - Sağlık raporun varsa mazeretli kayıt, mazeret sınavı, kayıt dondurma ve laboratuvar tekrarı taleplerine birim yönetim kurulu karar verir.
  - Rapor süresi içinde hiçbir sınava giremezsin; girersen o sınav geçersiz sayılır.
  - Rapor saatinden önce girdiğin sınavlar geçerlidir ve o dersin mazeret sınavına giremezsin.
hakli_nedenler#bent-2:
  - Üniversiteyi temsilen ya da uluslararası düzeydeki spor müsabakalarına katılırsan organizasyon boyunca izinli sayılırsın ve bu günler devamsızlığa sayılmaz.
  - Federasyon, kulüp veya dernek etkinlikleri ve milli takım seçmeleri için izinli sayılmazsın.
hakli_nedenler#bent-3:
  - Mazeret belgeni bir dilekçeyle birimine teslim edersen, aşağıdaki durumlardaki taleplerine birim yönetim kurulu karar verir.
  - Belgelenmiş doğal afet, birinci ila üçüncü derece yakınının ağır hastalığı ya da ölümü mazeret sayılır; ölüm halinde mazeret ölüm gününden itibaren bir haftadır.
  - Ekonomik nedenle kayıt dondurmak için durumunu en geç dönemin 4. haftası mesai bitimine kadar belgelemelisin.
  - Askere alınma, resmi görevle Eskişehir dışına tayin ve yurt dışında burs, staj veya araştırma imkanı kayıt dondurma nedeni olabilir (dil okulu ve Erasmus+ stajı hariç).
  - Sınavların aynı gün ve saatte çakışırsa ya da bir sınavdan diğerine yetişmen mümkün değilse, belgelemen şartıyla mazeret sınavı isteyebilirsin.
hakli_nedenler#bent-4:
  - Belgede sayılmayan başka mazeretler de birim yönetim kurulunca değerlendirilir ve Rektörlük onayına sunulur.
hakli_nedenler#bent-5:
  - Üniversiteyi ya da Türkiye'yi bilimsel, sanatsal, sportif veya kültürel bir etkinlikte temsil edersen, yol dahil katıldığın süre için mazeretli kayıt, mazeret sınavı ve kayıt dondurma talep edebilirsin.
hakli_nedenler#bent-6:
  - Mazeret sınavına girebilmek için sınavın bittiği günden sonraki üç iş günü içinde mazeret belgeni bir dilekçeyle birimine vermen zorunludur.
  - Üç iş günü içinde başvurmazsan mazeret sınavı hakkından vazgeçmiş sayılırsın.
hakli_nedenler#bent-7:
  - Laboratuvar dersi tekrarı için mazeret belgeni ders gününden itibaren üç iş günü içinde dilekçeyle birimine vermelisin.
  - Bir dönemde en fazla iki laboratuvar dersi için mazeret kullanabilirsin.
hakli_nedenler#bent-8:
  - Bu esaslarda hüküm olmayan durumlarda ilgili mevzuat geçerlidir.
hakli_nedenler#bent-9:
  - Bu esaslarla 2018 tarihli eski haklı ve geçerli nedenler düzenlemesi yürürlükten kaldırılmıştır.
hakli_nedenler#bent-10:
  - Bu esaslar Senato'nun kabul ettiği tarihten itibaren geçerlidir.
hakli_nedenler#bent-11:
  - Bu esasları ESTÜ Rektörü yürütür.

# ---------------- Tek Ders Sınavı ----------------
tek_ders#giris-0:
  - Bu belge, devam şartını sağladığı tek dersten FF veya YZ alan ve mezun olabilecek durumdaki öğrenciler için yapılan tek ders sınavının kurallarını açıklar.
tek_ders#bent-1:
  - Devam şartını sağladığın tek dersten FF veya YZ ile kaldıysan ve başka eksiğin yoksa, dersin hangi dönem açıldığına bakılmadan her dönem sonunda tek ders sınavına girebilirsin.
tek_ders#bent-2:
  - Tek ders sınavı için ilan edilen tarihlerde, danışmanının görüşünü de içeren bir dilekçeyle birimine başvurman gerekir.
tek_ders#bent-3:
  - Tamamen uygulamalı derslerde ve finali uygulamalı yapılan derslerde tek ders sınavı yapılmaz.
tek_ders#bent-4:
  - Tek ders sınavında 100 üzerinden aldığın not harf notuna çevrilir; örneğin 84-100 AA, 50-55 CC, 33-39 DD ve 0-32 FF'dir.
tek_ders#bent-5:
  - Tek ders sınavı için mazeret sınavı hakkı verilmez.
tek_ders#bent-6:
  - Hiç almadığın, devamsızlıktan kaldığın bir dersten ya da not yükseltmek için tek ders sınavına giremezsin.
tek_ders#bent-7:
  - Tek ders sınavından kalırsan aynı dersten yeniden tek ders sınavına girebilirsin.
tek_ders#bent-8:
  - Bu esaslar Senato'nun kabul ettiği tarihte yürürlüğe girmiştir.
tek_ders#bent-9:
  - Bu esasları ESTÜ Rektörü yürütür.
tek_ders#ek-2:
  - Bu, tek ders sınavı başvuru dilekçesinin örneğidir; dersin kodu, adı, türü ve AKTS'si yazılır ve danışman onaylar.

# ---------------- Ek Sınav Esasları ----------------
ek_sinav#giris-0:
  - Bu belge, azami süre sonunda mezun olamayan son sınıf öğrencilerine verilen ek sınav hakkının kurallarını açıklar.
ek_sinav#bent-1:
  - Ek sınava girebilmek için azami öğrenim süreni (lisansta 14 yarıyıl) doldurmuş ve son sınıf öğrencisi olman gerekir.
ek_sinav#bent-2:
  - Azami süreyi dolduran son sınıf öğrencisine FF ve YZ notlu, hiç almadığı ya da devamsız kaldığı bütün dersler için iki ek sınav hakkı verilir.
  - Ek sınavlar sonunda başarısız ders sayını beşe veya daha aşağıya indiremezsen kaydın silinir.
  - Ek sınavlardan önce 2-5 dersin kaldıysa dört yarıyıl, ek sınavlardan sonra 2-5 dersin kaldıysa üç yarıyıl ek süre verilir.
  - Mezuniyete tek dersin kaldıysa o dersin ek sınavlarına sınırsız girebilirsin, ama öğrencilik haklarından yararlanamazsın.
  - Ek süre kullanan öğrenci öğrencilik haklarından yararlanamaz.
  - Bütün derslerini geçtiğin halde GNO'n 2,00'nin altındaysa, ortalamanı yükseltmek için istediğin derslerden sınırsız ek sınava girebilirsin.
ek_sinav#bent-3:
  - Son sınıf öğrencisi olmadan azami süreyi dolduran öğrenciye ek sınav hakkı tanınmaz ve kaydı silinir.
  - Ek sınav için kaldığın dersleri gösteren, danışman onaylı bir dilekçeyle birimin öğrenci işlerine başvurmalısın.
  - Bütün derslerini geçip yalnızca stajı kalan öğrenciye stajı bitirmesi için üç yıl (altı yarıyıl) ek süre verilir.
  - Sınırsız sınav hakkı kullanan öğrenciden her ders kredisi için ücret alınır.
  - Sınırsız sınav hakkın varken üç yıl boyunca hiç sınava girmezsen hakkından vazgeçmiş sayılır ve kaydın silinir.
  - Ek sınavlara not yükseltmek için girilemez; yalnızca GNO'su 2,00'nin altında olan öğrenciler bu amaçla girebilir.
  - Ek sınavlar için mazeret sınavı yapılmaz.
  - Ek sınavlar akademik takvimdeki tarihlerde yapılır ve sonuçlar mutlak sistem dönüşüm tablosuyla harf notuna çevrilir.
ek_sinav#ek-2:
  - Ek sınavda 100 üzerinden aldığın not harf notuna çevrilir; örneğin 84-100 AA, 50-55 CC, 33-39 DD ve 0-32 FF'dir.

# ---------------- Yaz Okulu ----------------
yaz_okulu#bent-1:
  - Yaz okulunda ders açma, kayıt, dersler ve sınavlar Senato'nun belirlediği akademik takvime göre yürür.
yaz_okulu#bent-2:
  - Yaz okulunda açılacak dersleri bölümler önerir, birim kurulu karar verir ve Senato onaylar.
yaz_okulu#bent-3:
  - Yaz okulunda bir dersin açılması için gereken en az öğrenci sayısını birim kurulu belirler.
yaz_okulu#bent-4:
  - Kayıt yetersizliği nedeniyle açılamayan dersin yerine, derslerin ilk 2 günü içinde (varsa fark ücretini ödeyerek) başka ders alabilirsin; istemezsen ücretin iade edilir.
yaz_okulu#bent-5:
  - Uygulamalı dersler yaz okulunda açılamaz.
yaz_okulu#bent-6:
  - Ön koşullu bir dersi yaz okulunda alabilmen için danışmanının ön koşulu kontrol edip onay vermesi gerekir.
yaz_okulu#bent-7:
  - Yaz okulu ara sınavlar dahil en az 5 hafta sürer.
yaz_okulu#bent-8:
  - Yaz okulu bahar döneminin devamı sayıldığı için azami öğrenim sürene eklenmez.
yaz_okulu#bent-9:
  - Yaz okulunda en çok 20 AKTS'lik derse kayıt olabilirsin.
  - Yaz okulu sonunda mezun olacak durumdaysan yaz okulunda en çok 25 AKTS alabilirsin.
  - Başka üniversitenin yaz okulundan aldığın derslerin kredisi de yaz okulu AKTS sınırına dahildir.
yaz_okulu#bent-10:
  - Yaz okulundan ders alabilmek için yaz okulu ders alma talep formunu danışmanına imzalatman gerekir.
yaz_okulu#bent-11:
  - Yaz okulunda dersler başladıktan sonra ekle/sil ve dersten çekilme yapılamaz.
  - Haklı bir nedenle hatalı kaydın düzeltilmesi için kayıtlardan sonraki ilk iş günü birimine dilekçe vermelisin.
yaz_okulu#bent-12:
  - Yaz okulu ücreti seçtiğin derslerin saatine göre hesaplanır ve duyurulan bankaya tamamını ödemen gerekir.
  - Ödeme yapmazsan yaz okulu kaydın onaylanmaz ve seçtiğin dersler silinir.
yaz_okulu#bent-13:
  - Ödediğin tutar seçtiğin derslerin tutarıyla eşitse yaz okulu kayıt onayın sistemden otomatik verilir.
yaz_okulu#bent-14:
  - Şehit ve gazi yakınları, terörle mücadelede hayatını kaybedenlerin ve malullerin yakınları, İstiklal Madalyası sahiplerinin çocukları ve Devlet burslusu öğrencilerden yaz okulu ücreti alınmaz.
yaz_okulu#bent-15:
  - Seçmeli bir dersin yerine farklı kodlu ders alırsan "yerine" işlemini mutlaka yaptırmalısın; bunun için ödeme yapmadan önce dilekçeyle birimine onaylatmalısın.
  - Kayıtlar bittikten sonra "yerine" işlemi yapılmaz.
yaz_okulu#bent-16:
  - Başka üniversitelerin yaz okulundan, yönetim kurulu kararıyla ders alabilirsin; o üniversitenin kayıt kurallarına da uymalısın.
yaz_okulu#bent-17:
  - ESTÜ'nün yaz okulunda açılan bir dersin eşdeğerini, çakışma olmadıkça başka üniversitenin yaz okulundan alamazsın.
yaz_okulu#bent-18:
  - Başka üniversiteden alınacak dersin eşdeğerliğine Alan Komisyonu karar verir; yönetim kurulu onayı olmadan alınan dersler sayılmaz.
yaz_okulu#bent-19:
  - Başka üniversiteden alacağın zorunlu dersin kredisi ESTÜ'deki dersin kredisine eşit ya da fazla olmalı ve içeriği en az %80 örtüşmelidir.
  - Seçmeli ve mesleki seçmeli dersler için Alan Komisyonu görüşü aranmadan yönetim kurulu karar verir.
yaz_okulu#bent-20:
  - Başka üniversitenin yaz okulunda aldığın notlar, ESTÜ'nün not karşılıkları uygulama esaslarına göre transkriptine aktarılır.
yaz_okulu#bent-21:
  - ESTÜ yaz okuluna diğer üniversitelerin öğrencileri de misafir öğrenci olarak katılabilir.
yaz_okulu#bent-22:
  - Misafir öğrenciler kendi üniversitelerinden izin alarak kayıt olur; ücretlerini ESTÜ Yönetim Kurulu belirler.
yaz_okulu#bent-23:
  - Misafir öğrencilere aldıkları dersleri ve notlarını gösteren bir belge düzenlenir ve kendi üniversitelerine resmi yazıyla bildirilir.

# ---------------- Not Karşılıkları ----------------
not_karsiliklari#giris-0:
  - Bu belge, kredili ve mutlak sistemdeki notların birbirine nasıl çevrileceğini açıklar.
not_karsiliklari#bent-1:
  - Başka bir üniversitede ya da mutlak sistemde aldığın ve kabul edilen ders notları, 100'lük nottan harf notuna dönüşüm tablosuyla çevrilip transfer edilir.
  - Dönüşüm tablosuna göre 84-100 AA, 77-83 AB, 71-76 BA, 66-70 BB, 61-65 BC, 56-60 CB, 50-55 CC, 46-49 CD, 40-45 DC, 33-39 DD ve 0-32 FF'dir.
not_karsiliklari#bent-2:
  - Benzer not sistemi olan yurt içi ve yurt dışı üniversitelerden alınan notlar, Üniversite Yönetim Kurulu'nun kabul ettiği tablolara göre çevrilir ve GNO'ya katılır.
not_karsiliklari#bent-3:
  - Başka üniversitede mezun olmuş öğrenciler için de aynı kurallar geçerlidir; o kurumun kendi dönüşüm tabloları dikkate alınmaz.
not_karsiliklari#bent-4:
  - Hangi not sisteminde okuduysan o sistemdeki ortalaman esas alınır.
  - Bir başvuruda diğer sisteme göre ortalama şartı aranıyorsa, 4'lük veya 5'lik sistemdeki GNO'n tablolarla 100'lük sisteme çevrilir; bu tablolar belgede görüntü olarak yer alır.
not_karsiliklari#bent-5:
  - ESTÜ lisans notlarının ECTS karşılıkları AA ve AB için A, BA ve BB için B, BC ve CB için C, CC ve CD için D, DC ve DD için E, FF için F'dir.
not_karsiliklari#bent-6:
  - Bu madde GRE ve GMAT puanlarının ALES karşılıklarını tablo halinde verir; örneğin eski sistem GRE 800 ALES 100'e karşılık gelir.
not_karsiliklari#bent-7:
  - ESTÜ'de İngilizce yeterlik için YDYO sınavından ya da YDS/YÖKDİL'den 70, TOEFL IBT'den 84, PTE Academic'ten 71 puan gerekir.
  - Almanca, Fransızca, Rusça, İtalyanca ve İspanyolca için de YDYO sınavından 70 ya da tabloda belirtilen uluslararası sınav seviyeleri kabul edilir.
  - TOEFL IBT'nin evden yapılan Home Edition sürümü kabul edilmez.
not_karsiliklari#bent-8:
  - Bu uygulama esasları Senato'nun kabul ettiği tarihte yürürlüğe girmiştir.
not_karsiliklari#bent-9:
  - Bu uygulama esaslarını ESTÜ Rektörü yürütür.
not_karsiliklari#tablo_gorsel-2:
  - Bu sayfadaki dönüşüm tablosu belgede görüntü olarak yer aldığı için okunamıyor; değerler için belgenin 2. sayfasına bakmalısın.
not_karsiliklari#tablo_gorsel-3:
  - Bu sayfadaki dönüşüm tablosu belgede görüntü olarak yer aldığı için okunamıyor; değerler için belgenin 3. sayfasına bakmalısın.
not_karsiliklari#tablo_gorsel-4:
  - Bu sayfadaki dönüşüm tablosu belgede görüntü olarak yer aldığı için okunamıyor; değerler için belgenin 4. sayfasına bakmalısın.
not_karsiliklari#tablo_gorsel-5:
  - Bu sayfadaki dönüşüm tablosu belgede görüntü olarak yer aldığı için okunamıyor; değerler için belgenin 5. sayfasına bakmalısın.

# ---------------- Proje Temelli Staj ----------------
proje_temelli_staj#madde-1:
  - Bu yönerge ESTÜ'deki proje temelli staj (PTS) uygulamasının kurallarını düzenler.
proje_temelli_staj#madde-2:
  - Yönerge, eğitim-öğretim yönetmeliğinin 8. maddesine ve 2547 sayılı Kanun'a dayanır.
proje_temelli_staj#madde-3:
  - Proje temelli staj, kurumların belirlediği bir projeye katkı sağlayarak deneyim kazandığın proje esaslı bir stajdır.
  - Stajda biri üniversiteden akademik danışman, biri kurumdan sektör danışmanı olmak üzere iki danışmanın olur.
proje_temelli_staj#madde-4:
  - PTS uygulamasını Kariyer Gelişimi ve Öğrenci Destek Birimi içindeki PTS Koordinatörlüğü yürütür.
proje_temelli_staj#madde-5:
  - PTS Koordinatörlüğü kurumlardan gelen proje taleplerini duyurur, aday öğrencileri belirleyip mülakata gönderir ve yerleştirir.
  - Koordinatörlük stajın iş birliği protokolüne uygun yürümesini sağlar ve iş yerinde karşılaştığın sorunlara çözüm arar.
proje_temelli_staj#madde-6:
  - PTS koordinatörünü Kariyer Gelişimi ve Öğrenci Destek Birimi Müdürü görevlendirir.
proje_temelli_staj#madde-7:
  - Koordinatör PTS çalışmalarını düzenler, yıllık rapor hazırlar ve iş yeri isterse öğrencinin stajını sonlandırabilir.
proje_temelli_staj#madde-8:
  - Fakülte staj komisyonları kendi staj yönergelerine göre belirlenir ve PTS koordinatörlüğüyle birlikte çalışır.
proje_temelli_staj#madde-9:
  - Fakülte staj komisyonları firmaların PTS taleplerini öğrencilere duyurur ve başvuruları koordinatörlüğe iletir.
proje_temelli_staj#madde-10:
  - İsteğe bağlı proje temelli staj (PTS) en az 45, en fazla 90 iş günü sürer.
  - Firma, haftada en az yarım gün akademik danışmanınla görüşmen için izin verir.
  - Staj komisyonu onaylarsa PTS en fazla bir zorunlu stajın yerine sayılabilir.
  - Başvurmak için lisansta 4. yarıyılı tamamlamış olman ve disiplin cezası almamış olman gerekir.
proje_temelli_staj#madde-11:
  - Süreç kurumların proje talebiyle başlar; başvurular kurumlara iletilir, kurumlar mülakat yapıp stajyerleri seçer.
  - PTS öğrenim boyunca bir kez ve dersler yokken yapılır; hafta içi en az üç günü boş olan öğrenciler herhangi bir ayda başlayabilir.
proje_temelli_staj#madde-12:
  - PTS başvurusu için transkript, başvuru formu, özgeçmiş ve kurumun istediği diğer belgeler gerekir.
proje_temelli_staj#madde-13:
  - PTS'ye başlayan her öğrenciye bölümünden bir akademik danışman atanır.
  - Akademik danışman projenin ilerleyişini izler, staj raporunu hazırlamana rehberlik eder ve raporu değerlendirir.
proje_temelli_staj#madde-14:
  - İş yeri, kendi çalışanlarından birini sektör danışmanın olarak atar.
  - Sektör danışmanı projedeki performansını takip eder ve staj raporunu değerlendirir.
proje_temelli_staj#madde-15:
  - PTS'de kurum sana en az yasal oranda ücret öder; ulaşım ve diğer sosyal imkanlardan da yararlandırılman beklenir.
  - Staj süresince sigorta primlerini üniversite öder.
proje_temelli_staj#madde-16:
  - Staj bitince akademik danışmanının rehberliğinde staj raporunu hazırlar, iki danışmana imzalatıp ilgili birimlere teslim edersin.
  - PTS, birim staj komisyonunun önerisi ve yönetim kurulu kararıyla zorunlu staj olarak kabul edilebilir.
  - Raporun iki danışman tarafından ayrı ayrı 100 üzerinden puanlanır; başarılı olmak için ortalamanın en az 70 ve her iki puanın da en az 50 olması gerekir.
proje_temelli_staj#madde-17:
  - PTS süresince kurumun çalışma, disiplin ve iş güvenliği kurallarına uymak zorundasın.
proje_temelli_staj#madde-18:
  - PTS'ye devam zorunludur; mazeretler dahil devamsızlığın sürenin %10'unu aşarsa stajın iptal edilir.
  - Haklı bir gerekçe olmadan stajı iptal edilen öğrenci bir daha PTS'ye başvuramaz.
proje_temelli_staj#madde-19:
  - Yönergede hüküm olmayan durumlarda ilgili diğer mevzuat uygulanır.
proje_temelli_staj#madde-20:
  - Bu yönergeyle 2018 tarihli eski Proje Tabanlı Staj Yönergesi yürürlükten kaldırılmıştır.
proje_temelli_staj#madde-21:
  - Yönerge Senato'da onaylandığı tarihte yürürlüğe girmiştir.
proje_temelli_staj#madde-22:
  - Yönergeyi Rektör yürütür.
proje_temelli_staj#ek-2:
  - Bu, üniversite ile firma arasında imzalanan PTS iş birliği protokolünün örneğidir.
  - Protokole göre firma stajyerin ulaşım ve yemek giderlerini karşılar ve her ay en az yasal oranda ücret öder; sigorta primlerini üniversite öder.
