# Her parça için sade dilde özet cümleleri (elle yazıldı, kaynak metinden çıkmadan).
# Uygulama soruya en uygun 1-3 cümleyi seçip kısa cevap olarak gösteriyor.
# İlk cümle genel özet, soru hiçbir cümleyle eşleşmezse o gösterilir.
# Anahtar = cikti/parcalar.jsonl içindeki parça id'si.

# ---------------- Yönetmelik ----------------
yonetmelik#madde-1:
  - Bu yönetmelik ESTÜ'deki ön lisans ve lisans programlarının eğitim, öğretim ve sınav kurallarını belirler.
  - Pilotaj programı hariç bütün programlar bu yönetmeliğe tabidir.
yonetmelik#madde-2:
  - Yönetmelik, 2547 sayılı Yükseköğretim Kanunu'na dayanılarak hazırlanmıştır.
yonetmelik#madde-3:
  - Bu madde yönetmelikte geçen kısaltmaları açıklar.
  - AKTS Avrupa Kredi Transfer Sistemi, DNO dönem not ortalaması, GNO ise genel not ortalaması demektir.
  - Çift anadal, iki programdan aynı anda ders alıp iki ayrı diploma almayı sağlayan programdır.
  - Kredili sistemde başarı notu bağıl olarak, yani sınıfın genel başarısına göre değerlendirilir.
yonetmelik#madde-4:
  - Bir öğretim yılı güz ve bahar yarıyıllarından oluşur; her yarıyıl final sınavları hariç en az 14 haftadır.
  - Akademik takvimi Senato belirler.
  - Yaz okulu, birim yönetim kurulunun teklifi ve Üniversite Yönetim Kurulunun onayıyla açılabilir.
yonetmelik#madde-5:
  - ESTÜ'de öğretim ders geçme esasına dayalı kredili sistemle yürütülür.
  - Dersler teorik ders, laboratuvar, atölye, staj ve uygulamalardan oluşur ve yarıyıllık düzenlenir.
  - Bazı dersler uzaktan ya da hem yüz yüze hem uzaktan verilebilir; bu dersler için ek ücret istenmez.
yonetmelik#madde-6:
  - Lisans programının normal süresi 8 yarıyıl (4 yıl), azami süresi ise 14 yarıyıldır (7 yıl); hazırlık sınıfı bu sürelere dahil değildir.
  - Kaydını yenilemesen bile azami süren işlemeye devam eder.
  - Normal süre içinde mezun olamazsan katkı payı veya öğrenim ücreti ödemen gerekir.
  - Bütün derslerini bitirip yalnızca zorunlu stajı kalan öğrenciden katkı payı alınmaz.
  - Azami süre sonunda da mezun olamazsan yalnızca derslere ve sınavlara girebilirsin, diğer öğrencilik haklarından yararlanamazsın.
  - Yabancı dil hazırlık süresi en çok 2 yıldır ve normal ya da azami süreden sayılmaz.
  - Erasmus gibi değişim programlarında geçen dönemler program süresine ve azami süreye dahildir.
yonetmelik#madde-7:
  - Azami süre sonunda mezun olamayan son sınıf öğrencilerine ek sınav hakkı verilir.
  - Bütün derslerini geçip yalnızca 2,00 GNO şartını sağlayamadığı için ilişiği kesilecek öğrenciler de ek sınav hakkından yararlanır.
  - Ek sınavların ayrıntıları Senato'nun kabul ettiği ek sınav uygulama esaslarındadır.
yonetmelik#madde-8:
  - Derslerin kredisi, öğrencinin iş yüküne göre belirlenen AKTS kredisidir.
  - Lisans ders planlarında seçmeli derslerin toplamı en az 60 AKTS olmalıdır.
  - Ders planındaki seçmeli kredini tamamladıktan sonra yeni seçmeli dersi ancak "yerine" işlemiyle alabilirsin.
  - Ön koşullu bir dersi alabilmek için ön koşul dersini en az bir kez almış ve devam şartını sağlamış olman gerekir.
  - Bitirme projesi gibi 7. ve 8. yarıyıl derslerini alabilmek için ilk dört yarıyılın bütün zorunlu derslerini geçmiş ya da en az 180 AKTS'lik ders başarmış olman gerekir.
  - Bitirme Projesi I'i geçmeden Bitirme Projesi II'yi alamazsın.
  - AA veya YT aldığın bir dersi tekrar alamazsın.
  - Staj, kamu ya da özel kurumlarda birimin staj yönergesine göre yapılır.
yonetmelik#madde-9:
  - Üniversiteyi kazanan aday, YÖK ve üniversitenin belirlediği esaslara göre kaydını yaptırır.
  - e-Devlet'ten doğrulanabilen belgeler kayıtta ayrıca istenmez.
  - Kesin kaydını yaptırmayan aday öğrencilik hakkından vazgeçmiş sayılır.
yonetmelik#madde-10:
  - Her yarıyıl başında kaydını yenilemen gerekir; katkı payın varsa ve ödemezsen kaydın yenilenmez.
  - Güz ve bahar yarıyıllarının her birinde danışman onayıyla en çok 45 AKTS'lik derse kayıt olabilirsin; çift anadal öğrencileri için bu sınır 60 AKTS'dir.
  - Başka üniversiteden aldığın derslerin kredisi de bu 45 AKTS sınırına dahildir.
  - Ekle/sil haftasında danışman onayıyla ders değiştirebilir, bırakabilir ya da yeni ders ekleyebilirsin.
  - Ekle/sil tarihlerinden sonraki üç hafta içinde, danışman onayıyla ilk kez aldığın derslerden yalnızca birinden çekilebilirsin.
yonetmelik#madde-11:
  - Her öğrenciye bölüm başkanının önerisiyle bir öğretim elemanı akademik danışman olarak atanır.
  - Danışman, her dönem başında ders seçiminde seni bilgilendirir ve seçtiğin dersleri onaylar.
  - Danışman ayrıca üniversiteye uyum, mesleki gelişim ve kariyer konularında seni yönlendirir.
  - Danışman görüşme saatlerini kayıtlar başlamadan önce ilan eder; ekle/sil haftasında yoksa yerine geçici danışman atanır.
yonetmelik#madde-12:
  - Derslere en az %80 devam etmek zorunludur; yani devamsızlık sınırı derslerin %20'sidir.
  - Teorik ve uygulama kısmı olan derslerde herhangi bir kısımdan devamsızlık sınırını aşarsan o dersten devamsız sayılırsın.
  - Devam şartını sağlamadığın dersin final sınavına giremezsin.
  - Üniversiteyi veya Türkiye'yi temsil ettiğin günlerde, yönetim kurulu kararıyla izinli sayılırsın ve devamsız yazılmazsın.
yonetmelik#madde-13:
  - Yatay geçiş, dikey geçiş, çift anadal ya da değişim programıyla gelen öğrencilerin ders kredi ve not transferi yapılır.
  - Önceki okulunda en az DD veya YT aldığın derslerin transferini, GNO'n 2,00'nin altına düşmeyecek şekilde isteyebilirsin.
  - Transfer için belgelerini bir dilekçeyle, kayıt olduğun ilk dönem derslerin başlamasından itibaren üç hafta içinde birimine vermelisin.
  - Transfer kararı bütün öğrenim süreni kapsayacak şekilde bir defaya mahsus verilir.
  - Daha önce geçtiğin Atatürk İlkeleri, Türk Dili ve yabancı dil derslerini GNO şartı aranmadan transfer ettirebilirsin.
yonetmelik#madde-14:
  - Transkriptte aldığın bütün dersler, harf notların, dönem ortalamaların (DNO) ve genel ortalaman (GNO) yer alır.
yonetmelik#madde-15:
  - Zorunlu hazırlık sınıfı olan programlarda bölüme başlamak için hazırlığı en çok 2 yıl içinde bitirmen gerekir.
  - Öğretim dili kısmen ya da tamamen yabancı dil olan bir programın hazırlığını 2 yılda bitiremezsen programdan ilişiğin kesilir.
yonetmelik#madde-16:
  - Mezuniyet aşamasındaysan ve ders o dönem açılmıyorsa ya da çakışıyorsa, eşdeğer dersi başka bir üniversiteden alabilirsin.
  - Başka üniversitelerin yaz okulundan da yönetim kurulu kararıyla ders alabilirsin.
  - Başka üniversiteden alınan derslerin kredi ve not transferine birim yönetim kurulu karar verir.
yonetmelik#madde-17:
  - Her ders için en az bir ara sınav ve bir final sınavı yapılır; uygulamalı derslerde yalnızca final yapılabilir.
  - Sınav tarihleri sınavlardan en az 15 gün önce ilan edilir.
  - Final sınavına girebilmek için o dersin devam şartını sağlamış olman gerekir.
  - Ders notun ara sınav, ödev ve uygulama notlarıyla final notunun birlikte değerlendirilmesiyle belirlenir.
  - Haklı ve geçerli bir mazeretle sınava giremezsen, yönetim kurulu kararıyla mazeret sınavı hakkı verilir.
  - Mazeret sınavı için sınavın bittiği günden sonraki üç iş günü içinde mazeret belgeni bir dilekçeyle birimine teslim etmelisin.
  - Sınav kağıtları en az 2 yıl saklanır.
yonetmelik#madde-18:
  - Bir dersin ara sınav, ödev ve final ağırlıkları dönemin ilk iki haftası içinde dersin sayfasında duyurulur.
  - Dönem içi notların başarı notuna katkısı en az %30, en fazla %60 olabilir.
  - Harf notun, dersi alan bütün öğrencilerin genel başarısı da dikkate alınarak öğretim elemanınca belirlenir.
  - Harf notlarının katsayıları AA 4,00, AB 3,70, BA 3,30, BB 3,00, BC 2,70, CB 2,30, CC 2,00, CD 1,70, DC 1,30, DD 1,00 ve FF 0,00'dır.
  - ÇK, ekle/sil sonrası üç hafta içinde çekildiğin dersler için verilir.
  - DZ devamsızlık notudur; DZ alan öğrenci finale giremez ve DZ, FF ya da YZ ile aynı sayılır.
  - EK (eksik) notu haklı bir nedenle dersin gereklerini zamanında yapamayan öğrenciye verilir; eksiklerini bir sonraki dönem başlamadan tamamlamazsan EK, FF veya YZ'ye dönüşür.
  - YT (yeterli) ve YZ (yetersiz) ortalamaya katılmayan dersler için kullanılır.
  - GNO'n en az 2,00 ise bir dersten DD ya da üstü (veya YT) alman o dersi geçmen için yeterlidir.
yonetmelik#madde-19:
  - Başarı durumun her dönem sonunda dönem ortalaması (DNO) ve genel ortalama (GNO) ile belirlenir.
  - Ortalama, her dersin AKTS kredisi ile harf notu katsayısının çarpımlarının toplamının toplam krediye bölünmesiyle hesaplanır.
  - Tekrar aldığın bir dersin ortalamaya en son aldığın notu ve kredisi katılır.
  - Başarılı sayılmak için her dönem sonunda GNO'nun en az 2,00 olması gerekir; yaz okulu notları da GNO'ya katılır.
  - Zorunlu derslerden FF, YZ veya DZ aldıysan bu dersleri, ders planındaki döneminde ve en alt yarıyıldan başlayarak tekrar almak zorundasın.
  - Seçmeli bir dersten kalırsan o dersi tekrarlayabilir ya da danışman onayıyla yerine aynı türden başka bir seçmeli alabilirsin.
  - Güz veya bahar sonunda GNO'n 2,00'nin altındaysa akademik yetersizlik uyarısı alırsın; yaz okulunda ya da sonraki dönemde 2,00'ye çıkarırsan uyarı kalkar.
  - Uyarıdan sonraki dönemde de GNO'nu 2,00'ye çıkaramazsan, kaldığın derslere ek olarak CC'nin altında not aldığın dersleri de tekrar etmek zorunda kalırsın; 2,00'yi sağladığında tekrar zorunluluğu biter.
yonetmelik#madde-20:
  - Devam şartını sağladığın tek bir dersten FF veya YZ ile kalmış, mezun olabilecek durumdaki son sınıf öğrencisiysen tek ders sınavına girebilirsin.
  - Tek ders sınavı için ilan edilen tarihlerde birimine dilekçeyle başvurman gerekir.
  - Tamamen uygulamalı derslerde ve finali uygulamalı yapılan derslerde tek ders sınavı yapılmaz.
yonetmelik#madde-20/A:
  - Yaz okulu birim yönetim kurulunun teklifi ve Üniversite Yönetim Kurulunun onayıyla açılır; katılmak tamamen isteğe bağlıdır.
  - Yaz okulu sınavlar dahil en az beş hafta sürer ve azami süreden sayılmaz.
  - Yaz okulu bahar döneminin devamı sayılır ve yaz okulu notların GNO'na katılır.
  - Yaz okulunda en çok 20 AKTS'lik derse kayıt olabilirsin; yaz okulu sonunda mezun olacak durumdaysan sınır 25 AKTS'dir.
  - Bahar döneminde kaydını dondurduysan da yaz okulundan ders alabilirsin.
  - Yaz okulunda dersler başladıktan sonra ekle/sil ve dersten çekilme yapılamaz.
  - Yaz okulunda da derslere %80 devam zorunludur.
  - Yaz okulu ücretlidir; haklı bir nedenle kaydın iptal edilirse ücretin iade edilir.
  - Haklı bir mazeretle yaz okulu sınavına giremezsen mazeret sınavı hakkı verilebilir.
  - ESTÜ'de açılan bir dersin yerine, Üniversite Yönetim Kurulu kabul etmedikçe başka üniversitenin yaz okulundan ders alamazsın.
yonetmelik#madde-21:
  - Sınav sonucuna yalnızca maddi hata, yani notun yanlış hesaplanması ya da yanlış girilmesi gibi bir hata nedeniyle itiraz edebilirsin.
  - İtirazı, sonuçların öğrenci bilgi sisteminde ilan edilmesinden sonraki üç iş günü içinde birimine dilekçeyle yapmalısın.
yonetmelik#madde-22:
  - Bir dönemde en az 30 AKTS'lik ders geçen ve program süresini aşmamış öğrencilerden DNO'su 3,50 ve üstü olanlar yüksek onur, 3,00-3,49 arası olanlar onur öğrencisi olur.
  - O dönem FF, YZ, DZ veya EK notun varsa ya da disiplin cezası aldıysan onur listesine giremezsin.
  - Mezuniyette GNO'su 3,50 ve üstü olanlar yüksek onur, 3,00-3,49 arası olanlar onur öğrencisi olarak mezun olur.
yonetmelik#madde-23:
  - Usule aykırı kayıt yaptırdığı anlaşılan öğrencinin kaydı iptal edilir.
  - Kendi isteğinle kaydını sildirmek için birimine dilekçeyle başvurman yeterlidir.
  - Sınırsız sınav hakkı olup üç öğretim yılı boyunca hiç sınava girmeyen öğrencinin ilişiği kesilir.
  - Azami süre içinde dört yıl üst üste katkı payını ödemeyen ve kayıt yenilemeyen öğrencinin ilişiği kesilebilir.
  - Ek sınavlar ve verilen ek süreler sonunda da mezun olamayan öğrencinin ilişiği kesilir.
yonetmelik#madde-24:
  - Kayıt dondurma (kayıt hakkının saklı tutulması), haklı ve geçerli bir nedene dayanarak birim yönetim kurulu kararıyla yapılır.
  - Kaydını bir seferde en çok iki yarıyıl, öğrenimin boyunca toplam en çok dört yarıyıl dondurabilirsin.
  - Kaydının dondurulduğu süre azami öğrenim süresinden sayılmaz.
  - Tedavisi süren hastalık ya da hükümlülük durumunda dört yarıyıldan fazla dondurma da verilebilir.
yonetmelik#madde-25:
  - Lisanstan mezun olmak için en az 240 AKTS'lik dersi başarıyla tamamlaman, GNO'nun en az 2,00 olması ve ÇK, DZ, EK, FF ya da YZ notunun bulunmaması gerekir.
  - Mezuniyet için derslerin yanında staj gibi diğer yükümlülüklerini de yerine getirmiş olmalısın.
  - Mezuniyet derecen diplomaya yazılmaz.
  - İlk dört yarıyılı başarıyla bitirip GNO'su en az 2,00 olan lisans öğrencisi isterse kaydını sildirip ön lisans diploması alabilir.
yonetmelik#madde-26:
  - Yönetmelikte hüküm olmayan durumlarda 2547 sayılı Kanun ve ilgili diğer mevzuat uygulanır.
yonetmelik#madde-27:
  - Bu yönetmelikle 2018 tarihli eski ESTÜ Önlisans ve Lisans Eğitim-Öğretim ve Sınav Yönetmeliği yürürlükten kaldırılmıştır.
yonetmelik#madde-28:
  - Yönetmelik 2025-2026 eğitim-öğretim yılı başında yürürlüğe girmiştir.
yonetmelik#madde-29:
  - Yönetmeliği ESTÜ Rektörü yürütür.

# ---------------- Fen Fakültesi Staj Yönergesi ----------------
fen_staj#madde-1:
  - Bu yönerge Fen Fakültesi öğrencilerinin yapmakla yükümlü olduğu stajın planlanma, uygulanma ve değerlendirilme kurallarını düzenler.
fen_staj#madde-2:
  - Yönerge, eğitim-öğretim yönetmeliğinin 8. maddesine ve Yükseköğretimde Uygulamalı Eğitimler Çerçeve Yönetmeliği'ne dayanır.
fen_staj#madde-3:
  - Bu madde yönergede geçen kavramları tanımlar.
  - Bölüm Staj Komisyonu, bölümde staj işlerini yürüten komisyondur.
  - İsteğe bağlı staj, ders planında zorunlu olmadığı halde öğrencinin kendi isteğiyle yaptığı stajdır.
  - Yaz dönemi, bahar finallerinin bittiği tarihten güz derslerinin başladığı tarihe kadar olan dönemdir.
fen_staj#madde-4:
  - Fakülte Staj Komisyonu, dekan yardımcısı başkanlığında bölüm staj komisyonu başkanlarından oluşur.
  - Komisyon staj esaslarını ve staja başlama dönemlerini belirler, staj itirazlarını ve muafiyet taleplerini yönetim kuruluna sunar.
fen_staj#madde-5:
  - Bölüm Staj Komisyonu, bölüm başkanlığının görevlendirdiği üç öğretim elemanından oluşur.
  - Komisyon staj kılavuzunu hazırlar, başvuru belgelerini inceler, staj yeri bulmana yardımcı olur ve stajını başarılı ya da başarısız olarak değerlendirir.
fen_staj#madde-6:
  - Staj yapan her grup için yönetim kurulu bir sorumlu öğretim elemanı görevlendirir.
  - Sorumlu öğretim elemanı staj raporunu değerlendirip komisyona sunar ve staj notunu öğrenci bilgi sistemine girer.
fen_staj#madde-7:
  - Staj yapmaya dördüncü yarıyılın sonundan itibaren başlayabilirsin.
  - Stajı yaz döneminde ya da güz ile bahar arasındaki yarıyıl tatilinde yapabilirsin; ders dönemi devam ederken staj yapılamaz.
  - Mezuniyete yalnızca stajı kalmışsan ya da haftada en az 3 tam gün dersin yoksa, komisyon kararıyla dönem içinde derssiz günlerinde staj yapabilirsin.
  - Zorunlu staj süresi en az 20 iş günüdür; bu İstatistik, Fizik ve Biyoloji için geçerlidir, Kimya ve Matematik bölümlerinde staj zorunlu değil, isteğe bağlıdır.
  - Komisyon uygun görürse isteğe bağlı olarak daha uzun staj yapabilirsin, ama bu fazla süre mezuniyet kredisine sayılmaz.
  - Zorunlu stajla isteğe bağlı staja aynı anda devam edemezsin.
  - Komisyon uygun görürse yaptığın isteğe bağlı staj zorunlu staj yerine sayılabilir.
  - Staj süresince sigortan fakülte tarafından yapılır.
fen_staj#madde-8:
  - Staja devam zorunludur.
  - Geçerli bir mazeretle gidemediğin staj günlerini telafi etmen gerekir ve bu günler 20 iş günlük zorunlu stajın %10'unu, yani 2 iş gününü geçemez.
  - Kurallara uymazsan kurum stajını sonlandırabilir; bu durumda stajda başarısız sayılırsın.
  - Mücbir bir sebeple stajı yarıda bırakırsan, yaptığın günlerin sayılıp sayılmayacağına yönetim kurulu karar verir.
fen_staj#madde-9:
  - Staj için hazırlaman ve takip etmen gereken belgeler bu maddede sayılır.
  - Gerekli belgeler staj akış şeması, staj başvuru ve kabul formu, genel sağlık sigortası durum belgesi, SGK işe giriş bildirgesi, devam çizelgesi, kurum değerlendirme formu ve staj raporu dosyasıdır.
  - SGK işe giriş bildirgesini Öğrenci İşleri hazırlar ve stajdan önce sana verir.
  - Kurum değerlendirme formu staj bitince kapalı zarfta sana verilir ya da postayla dekanlığa gönderilir.
fen_staj#madde-10:
  - Staja başlamadan en az 15 gün önce staj başvuru ve kabul formunu doldurup Bölüm Staj Komisyonu'na teslim etmelisin.
  - Başvuru sonucu bölüm veya fakülte web sayfasında ilan edilir.
  - Başvurun onaylanınca değerlendirme formunu, staj raporu dosyasını ve diğer belgeleri fakülte web sayfasından alırsın.
fen_staj#madde-11:
  - Staj yeri bulmak tamamen senin sorumluluğundadır; komisyonlar yalnızca kolaylaştırıcı girişimlerde bulunabilir.
  - Kendi bulduğun yerde staja başlamadan önce Bölüm Staj Komisyonu'nun onayını alman zorunludur.
  - Yurt dışında da, değişim programıyla ya da kendi bulduğun bir kurumda komisyon önerisi ve yönetim kurulu kararıyla staj yapabilirsin; yurt dışı stajda sigorta primi ödenmez.
  - ARİNKOM'un iş birliği yaptığı kurumlarda proje tabanlı staj yapabilirsin; bölüm komisyonu uygun görürse bu staj zorunlu stajın yerine sayılır.
fen_staj#madde-12:
  - Staja başladıktan sonra Bölüm Staj Komisyonu'nun onayı olmadan staj yerini değiştiremezsin.
  - Kurumda grev, yangın, iflas, iş kazası ya da doğal afet olursa veya staj amacı dışında çalıştırılırsan, komisyon onayıyla stajını başka bir yerde tamamlayabilirsin.
  - Diğer mazeretlerle staj yeri değişikliğine Bölüm Staj Komisyonu karar verir.
fen_staj#madde-13:
  - Staja giderken SGK işe giriş bildirgesini, devam çizelgesini ve kurum değerlendirme formunu kurumdaki staj yetkilisine teslim edersin.
  - Staj bitince devam çizelgesi ve değerlendirme formu kaşeli ve kapalı zarfta sana verilir ya da kurum tarafından postayla dekanlığa gönderilir; kaşesiz formlar geçersizdir.
  - Yaptığın çalışmaları staj raporu sayfalarına düzenli işleyip kurum yetkilisine onaylatman gerekir; imzasız ve kaşesiz rapor kabul edilmez.
  - Kurumun gizli bilgilerini paylaşamazsın ve kurumun çalışma, disiplin ve iş güvenliği kurallarına uymak zorundasın.
  - Kurallara uymadığın için stajın sonlandırılırsa stajı tekrarlarsın.
  - Stajı yapacağın yarıyılda açılan staj ders gruplarından birine kaydolman ve staj raporunu belirlenen tarihe kadar sorumlu öğretim elemanına teslim etmen gerekir.
fen_staj#madde-14:
  - Stajın başarılı sayılması için kurumun doldurduğu değerlendirme formundaki notun 5 üzerinden en az 3 olması ön koşuldur.
  - Bölüm Staj Komisyonu stajını başarılı ya da başarısız olarak değerlendirir; gerekirse sözlü sunum isteyebilir.
  - Staj değerlendirmesine, kararın ilanından sonraki 5 iş günü içinde dekanlığa yazılı olarak itiraz edebilirsin.
  - Staj notu sisteme başarılıysa YT, başarısızsa YZ olarak işlenir.
  - Derslerini bitirip zorunlu stajını yapmayan ya da stajdan kalan öğrenciye mezuniyet belgeleri verilmez; başarılı olana kadar stajı tekrarlar.
  - Yalnızca stajı kalan öğrenci kaydını katkı payı ödemeden yeniler; kaydını yenilemeyen staj yapamaz.
fen_staj#madde-15:
  - Yatay ya da dikey geçişle geldiysen önceki okulunda yaptığın stajın kabulüne yönetim kurulu karar verir.
  - Geçişle geldiysen staj muafiyeti başvurunu ilk kayıt olduğun dönemin ikinci haftası sonuna kadar bölüm başkanlığına yapmalısın.
  - İlgili sektörde SGK'lı olarak staj süresi kadar çalıştığını belgelersen stajdan muaf tutulabilirsin.
  - Yandal öğrencilerinin yandal için zorunlu stajı yoktur.
  - Muafiyet kararına, ilandan sonraki 5 iş günü içinde dekanlığa yazılı itiraz edebilirsin.
fen_staj#madde-16:
  - Yönergede hüküm olmayan durumlarda eğitim-öğretim yönetmeliği ve Uygulamalı Eğitimler Çerçeve Yönetmeliği uygulanır.
fen_staj#madde-17:
  - Yönerge, Senato'nun kabul ettiği tarihte yürürlüğe girmiştir.
fen_staj#madde-18:
  - Yönergeyi ESTÜ Rektörü yürütür.
fen_staj#ek-2:
  - Staj akış şemasına göre önce kılavuzu ve yönergeyi incelersin, staj yeri bulursun ve başvuru formunu iki nüsha doldurursun.
  - Formu kuruma onaylatıp Bölüm ve Fakülte Staj Komisyonu başkanlarına onaylatırsın, sonra sigorta belgesiyle birlikte Öğrenci İşleri'ne iletip SGK girişini yaptırırsın.
  - Stajı bitirince staj raporu dosyasını, kurum değerlendirme formunu ve devam çizelgesini imza karşılığı teslim edersin.
fen_staj#ek-3:
  - Bu, staj başvuru ve kabul formunun örneğidir; öğrenci, staj yeri ve onay bilgileri bu forma yazılır.
  - Staj tarihin değişirse ya da stajdan vazgeçersen en az 10 gün önceden Öğrenci İşleri'ne haber vermen gerekir, yoksa doğacak SGK zararını sen karşılarsın.
  - Form iki asıl nüsha hazırlanır; biri kurumda kalır, diğerini fakülteye teslim edersin.
fen_staj#ek-4:
  - Bu, stajda her gün imzaladığın devam çizelgesinin örneğidir.
  - İstatistik, Fizik ve Biyoloji bölümlerinde 20 iş günü staj zorunludur; Kimya ve Matematik bölümlerinde staj isteğe bağlıdır.
  - Raporlu olduğun günleri telafi etmen ve raporunu Öğrenci İşleri'ne bildirmen gerekir.
fen_staj#ek-5:
  - Bu, kurumun seni 10 ölçüte göre 1-5 arasında puanladığı staj değerlendirme formudur.
  - Değerlendirme notunun ortalaması en az 3 olursa stajın başarılı sayılır.
fen_staj#ek-6:
  - Bu, staj raporu sayfasının örneğidir; her sayfaya çalıştığın bölüm ve tarih yazılır ve birim sorumlusuna imzalatılır.
fen_staj#ek-7:
  - Bu, staj raporunun kapak sayfası örneğidir (Times New Roman, kalın yazı).
fen_staj#ek-8:
  - Bu, staj raporunun İngilizce kapak sayfası örneğidir.
fen_staj#ek-9:
  - Bu, staj raporunun iç kapak sayfası örneğidir; öğrenci ve kurum bilgileri ile kurum yetkilisinin imzası yer alır.
fen_staj#ek-10:
  - Bu, staj raporunun İngilizce iç kapak sayfası örneğidir.
fen_staj#ek-11:
  - Bu, Bölüm Staj Komisyonu'nun seni değerlendirdiği formdur.
  - Stajın başarılı sayılması için hem kurumun değerlendirmesinden hem de komisyonun rapor değerlendirmesinden 5 üzerinden en az 3 alman gerekir.
fen_staj#ek-12:
  - Bu, stajı yarıda bırakan öğrenci için kurumun dekanlığa gönderdiği ayrılış formudur; SGK çıkışı bu formla yapılır.

