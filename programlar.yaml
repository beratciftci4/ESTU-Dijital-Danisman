# Uygulamada seçilebilen lisans programları.
#   fakulte   : fakulteler altındaki anahtar (staj yönergesi buradan bulunuyor)
#   bologna   : akts.eskisehir.edu.tr'deki program numarası
#   staj_gunu : zorunlu staj süresi, zorunlu staj yoksa null
#   staj_birimi: yönergedeki birim ("iş günü" ya da "gün"), yönerge nasıl yazıyorsa
#   staj_notu : staj süresinin nereden geldiği
#   staj_ek   : kısa cevaba eklenecek not (isteğe bağlı)
#   staj_suresi_belirsiz: true ise staj zorunlu ama süresi belgelerde yazmıyor (staj_gunu null)
#   staj_cumlesi: kısa cevapta kullanılacak, elle yazılmış staj cümlesi (isteğe bağlı)
#   staj_durumu_belirsiz: true ise belgeler stajın zorunlu olup olmadığını netleştirmiyor (staj_gunu null)

fakulteler:
  fen:
    ad: Fen Fakültesi
    staj_belgesi: fen_staj
    staj_maddesi: fen_staj#madde-7      # staj süresinin yazdığı madde
    staj_listesi: fen_staj#ek-4         # hangi bölümde zorunlu, hangisinde isteğe bağlı (EK-3 notu)
    staj_birimi: iş günü
  bbbf:
    ad: Bilgisayar ve Bilişim Bilimleri Fakültesi
    staj_belgesi: bbbf_staj
    staj_maddesi: bbbf_staj#madde-8     # ders planındaki her staj en az 20 iş günü
    staj_listesi: bbbf_staj#madde-8
    staj_birimi: iş günü
  hubf:
    ad: Havacılık ve Uzay Bilimleri Fakültesi
    staj_belgesi: hubf_staj
    staj_maddesi: hubf_staj#madde-9     # staj süreleri bölüm bölüm bu maddede
    staj_listesi: hubf_staj#madde-9
    staj_birimi: iş günü
  mtf:
    ad: Mimarlık ve Tasarım Fakültesi
    staj_belgesi: mtf_staj
    staj_maddesi: mtf_staj#madde-14     # zorunlu staj en az 60 iş günü, bütün bölümler
    staj_listesi: mtf_staj#madde-14
    staj_birimi: iş günü
  spor:
    ad: Spor Bilimleri Fakültesi
    staj_belgesi: spor_staj
    staj_maddesi: spor_staj#madde-8     # toplam staj en az 40 gün
    staj_listesi: spor_staj#madde-8
    staj_birimi: gün
  muhendislik:
    ad: Mühendislik Fakültesi
    staj_belgesi: muh_staj
    staj_maddesi: muh_staj#madde-8      # toplam staj en az 40 gün, bütün bölümler
    staj_listesi: muh_staj#madde-8
    staj_birimi: gün

